services:
  - type: web
    name: switchboard-job-switch
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: switchboard
      - key: OPENAI_API_KEY
        sync: false
